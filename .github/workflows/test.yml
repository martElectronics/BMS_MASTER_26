name: tests

# En cada push y PR: (1) corre los tests unitarios nativos (lógica pura, sin HW)
# y (2) compila el firmware STM32. Los runners de GitHub (ubuntu-latest) traen
# gcc/g++ para los tests; PlatformIO descarga el toolchain ARM para el build.
on:
  push:
  pull_request:

env:
  # Opta ya por Node 24 en las actions (checkout/setup-python aún traen Node 20,
  # deprecado). Silencia el warning sin cambiar de versión de action.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-tests:
    name: Tests nativos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run native unit tests
        run: pio test -e native -v

  build:
    name: Compila firmware (STM32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Compilar envs STM32 (default_envs)
        run: pio run
