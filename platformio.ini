; ============================================================================
;  CONFIG COMUN — heredada por todas las envs
; ============================================================================
[env]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
; STM32duino usa newlib-nano: printf/snprintf con %f NO imprime el numero
; por defecto. Este flag fuerza al linker a incluir el printf con float
; (en ESP32 %f va de serie; aqui es imprescindible para ver V/T).
; -D HAL_FDCAN_MODULE_ENABLED: habilita el HAL FDCAN del STM32G4 que
; usa MART_CAN. En hall_bench no se compila MART_CAN, el define es inerte.
; -D ADC_SAMPLINGTIME: sube el tiempo de muestreo del ADC al máximo del G4
; (640.5 ciclos). Necesario porque el amperímetro (PA0/PA1) ve la impedancia
; del divisor 18k/33k (~11.6 kohm) y con el sampling por defecto el cap de
; muestreo no se carga del todo -> lecturas ruidosas (~+-3 A). Solo el Hall
; usa analogRead, sin efectos secundarios.
build_flags = -Wl,-u,_printf_float -D HAL_FDCAN_MODULE_ENABLED -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_640CYCLES_5
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd.exe" -d1 -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32g4x.cfg -c "reset_config srst_only srst_nogate connect_assert_srst" -c "program {$PROG_PATH} verify" -c "reset run" -c "shutdown"

; ============================================================================
;  PRODUCCION — firmware del BMS master
; ============================================================================
[env:nucleo_g474re]
build_src_filter = +<main.cpp>

; ============================================================================
;  BANCO HALL — caracterizacion ruido ADC, offset, desconexion
;  Lanzar con:  pio run -e hall_bench -t upload
;  Monitor:     pio device monitor -e hall_bench
; ============================================================================
[env:hall_bench]
build_src_filter = +<hall_bench.cpp>

; ============================================================================
;  CARGA — firmware del cargador OBC TC HK-L 6.6kW (independiente del BMS)
;  Reutiliza lib/ (BQ79606, MART_CAN). CAN a baud del cargador (NO 125k coche).
;  Lanzar con:  pio run -e charger -t upload
;  Monitor:     pio device monitor -e charger
; ============================================================================
[env:charger]
build_src_filter = +<charger.cpp>
