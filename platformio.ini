; ============================================================================
;  default_envs: lo que construye `pio run` sin -e (solo los builds STM32).
;  El env nativo de tests se lanza aparte con `pio test -e native`.
; ============================================================================
[platformio]
default_envs = nucleo_g474re, hall_bench, charger, charger_cantest, bms_bench

; ============================================================================
;  CONFIG COMUN de los builds STM32 — los env de hardware la heredan (extends).
;  Va en [stm32] (no en [env]) para que el env nativo de tests NO herede
;  board/platform/upload (si no, "unknown board" al compilar en el PC).
; ============================================================================
[stm32]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
; STM32duino usa newlib-nano: printf/snprintf con %f NO imprime el numero
; por defecto. Este flag fuerza al linker a incluir el printf con float
; (en ESP32 %f va de serie; aqui es imprescindible para ver V/T).
; -D HAL_FDCAN_MODULE_ENABLED: habilita el HAL FDCAN del STM32G4 que
; usa MART_CAN. En hall_bench no se compila MART_CAN, el define es inerte.
; -D ADC_SAMPLINGTIME: sube el tiempo de muestreo del ADC al máximo del G4
; (640.5 ciclos). Necesario porque el amperímetro (PA0/PA1) ve la impedancia
; del divisor 18k/33k (~11.6 kohm) y con el sampling por defecto el cap de
; muestreo no se carga del todo -> lecturas ruidosas (~+-3 A). Solo el Hall
; usa analogRead, sin efectos secundarios.
build_flags = -Wl,-u,_printf_float -D HAL_FDCAN_MODULE_ENABLED -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_640CYCLES_5
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd.exe" -d1 -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select hla_swd" -f target/stm32g4x.cfg -c "reset_config srst_only srst_nogate connect_assert_srst" -c "program {$PROG_PATH} verify" -c "reset run" -c "shutdown"

; ============================================================================
;  PRODUCCION — firmware del BMS master
; ============================================================================
[env:nucleo_g474re]
extends = stm32
build_src_filter = +<main.cpp>

; ============================================================================
;  BANCO HALL — caracterizacion ruido ADC, offset, desconexion
;  Lanzar con:  pio run -e hall_bench -t upload
;  Monitor:     pio device monitor -e hall_bench
; ============================================================================
[env:hall_bench]
extends = stm32
build_src_filter = +<hall_bench.cpp>

; ============================================================================
;  CARGA — firmware del cargador OBC TC HK-L 6.6kW (independiente del BMS)
;  Reutiliza lib/ (BQ79606, MART_CAN). CAN a baud del cargador (NO 125k coche).
;  Lanzar con:  pio run -e charger -t upload
;  Monitor:     pio device monitor -e charger
; ============================================================================
[env:charger]
extends = stm32
build_src_filter = +<charger.cpp>
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; ============================================================================
;  TEST CAN CARGADOR — solo verifica comunicacion CAN con el OBC (sin BQ,
;  sin logica de carga; keep-alive SEGURO V=0 I=0 PARAR).
;  Lanzar con:  pio run -e charger_cantest -t upload
;  Monitor:     pio device monitor -e charger_cantest
; ============================================================================
[env:charger_cantest]
extends = stm32
build_src_filter = +<charger_cantest.cpp>

; ============================================================================
;  BANCO BMS — mismo main.cpp pero con ventanas de fallo RELAJADAS (1-1.5s)
;  para que un glitch del BQ no abra el SDC mientras se prueban otros
;  subsistemas. ⚠ SOLO PARA BANCO — NO FLASHEAR AL COCHE (incumple FS EV5.8).
;  Producción = [env:nucleo_g474re] (ventanas 0,5/1 s).
;  Lanzar con:  pio run -e bms_bench -t upload
; ============================================================================
[env:bms_bench]
extends = stm32
build_src_filter = +<main.cpp>
build_flags = ${stm32.build_flags} -D BENCH_BMS

; ============================================================================
;  TEST NATIVO — corre en el PC (sin HW). Para `pio test -e native`.
;  No hereda de [stm32] (platform native, sin board). No compila src/
;  (build_src_filter -<*>): los tests solo necesitan lib/FaultTimer/.
; ============================================================================
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*>

[env:Prueba_SDC]
extends = stm32
build_src_filter = +<Prueba_SDC.cpp>